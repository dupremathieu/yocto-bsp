# Builds SEAPATH and uploads SBOM artifacts.
# This is a reusable workflow that cannot be launched directly.
---
name: Build (internal)

on:
  workflow_call:
    inputs:
      origin_repository:
        type: string
        required: true
        description: Repository that triggered this workflow dispatch.
      origin_sha:
        type: string
        required: true
        description: >-
          Value of the GITHUB_SHA variable for the workflow on the
          origin repository.
      runner_labels:
        type: string
        required: false
        default: 'runner-sfl-seapath'
        description: >-
          Comma-separated labels of the self-hosted runners executing the
          builds. The image flavors are distributed round-robin across the
          labels so that several runners can build in parallel.

# This is absolutely crazy but Action Variables are not accessible to runs
# triggered by PRs from forks repository (https://github.com/orgs/community/discussions/44322).
# Thus, we avoid all use of Action Variables in the pr workflow and the ones
# called by it (_build and _cve-check) and we hardcode the values here.
# It makes developing the CI itself a pain but there is no real good solution.
env:
  REPO_MANIFEST_REPOSITORY: 'SEAPATH/repo-manifest'
  REPO_MANIFEST_NAME: 'wrynose.xml'

jobs:
  prepare:
    name: Prepare build matrix
    # Pure computation on a hosted runner: it only rewrites the flavor
    # list as a (flavor, runner label) matrix.
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.distribute.outputs.matrix }}
      max_parallel: ${{ steps.distribute.outputs.max_parallel }}
    steps:
      - id: distribute
        env:
          RUNNER_LABELS: ${{ inputs.runner_labels }}
        run: |
          set -euo pipefail

          # Hardcoded due to GH Actions limitation on vars (see above)
          flavors=(host_efi host_standalone_efi guest_efi observer_efi)

          if [ -z "${RUNNER_LABELS// /}" ]; then
              echo "runner_labels input must not be empty" >&2
              exit 1
          fi
          IFS=',' read -ra labels <<<"$RUNNER_LABELS"

          # Deduplicate while preserving order: a label given twice would
          # otherwise raise max-parallel above the available machines.
          declare -A seen=()
          unique=()
          for label in "${labels[@]}"; do
              label="${label//[[:space:]]/}"
              [ -n "$label" ] || continue
              case "$label" in
              *['\"\\']*)
                  echo "invalid runner label '$label'" >&2
                  exit 1
                  ;;
              esac
              if [ -z "${seen[$label]:-}" ]; then
                  seen[$label]=1
                  unique+=("$label")
              fi
          done
          if [ "${#unique[@]}" -eq 0 ]; then
              echo "no valid runner label found in '$RUNNER_LABELS'" >&2
              exit 1
          fi

          include=""
          for i in "${!flavors[@]}"; do
              [ "$i" -eq 0 ] || include+=","
              include+="{\"cqfd_flavor\":\"${flavors[$i]}\","
              include+="\"runner_label\":\"${unique[$((i % ${#unique[@]}))]}\"}"
          done

          {
              echo "matrix={\"include\":[${include}]}"
              # One concurrent job per machine. This relies on the runner
              # pool topology: each label must be registered by exactly
              # ONE runner instance, else two flavors could build at the
              # same time on the same host and fight over its persistent
              # Yocto cache.
              echo "max_parallel=${#unique[@]}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ["self-hosted", "${{ matrix.runner_label }}"]
    # This job may check out potentially unsafe user code from Pull Requests.
    # Giving it only the necessary permissions mitigates potential token misuse
    # introduced in user code.
    # The only step using the GitHub API is the "upload artifacts" one, which
    # seems to only need the "contents: read" permission as per [1]
    # [1] https://github.com/actions/upload-artifact/issues/197#issuecomment-3154708082
    permissions:
      contents: read
    strategy:
      fail-fast: true # TODO eventually set to false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      WORKSPACE: workspace-bitbake
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      # We clean the workspace at the beginning and not at the end
      # to easily debug failed runs
      - name: Clean workspace
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ${{ env.WORKSPACE }}

      - name: Create workspace
        working-directory: ${{ github.workspace }}
        run: mkdir -p ${{ env.WORKSPACE }}

      - name: Init repo
        run: |
          repo init \
            -u "${{ github.server_url }}/${{ env.REPO_MANIFEST_REPOSITORY }}" \
            -b "${{ case(inputs.origin_repository == env.REPO_MANIFEST_REPOSITORY, inputs.origin_sha, 'HEAD') }}" \
            -m "${{ env.REPO_MANIFEST_NAME }}"
          repo sync

      - name: Checkout specific ref
        if: inputs.origin_repository != env.REPO_MANIFEST_REPOSITORY
        env:
          ORIGIN_REPOSITORY: ${{ inputs.origin_repository }}
        run: |
          repo_name=${ORIGIN_REPOSITORY#*/} # this removes the '<organization>/' prefix
          path=$(repo list | awk -v repo_name="$repo_name" -F ' : ' '$2 == repo_name {print $1}')
          echo "Checking out specific revision for git repo "$repo_name" at "$path"..."

          cd "$path"
          # repo only creates 1 remote so no problem here
          remote=$(git remote)

          git fetch "$remote" "${{ inputs.origin_sha }}"
          git checkout FETCH_HEAD

      - name: Init build system
        run: |
          cqfd init
          touch "keys/ansible_public_ssh_key.pub"
          cp seapath.conf.sample seapath.conf

      - name: Build ${{ matrix.cqfd_flavor }}
        run: |
          # Since we are in a non-interactive bash, the bashrc file is not
          # read and CQFD environment variables are not used, especially the
          # Yocto cache -related ones... Thus we source the bashrc file.
          source /etc/bash.bashrc
          cqfd -b ${{ matrix.cqfd_flavor }}

      - name: Upload SBOM file
        uses: actions/upload-artifact@v7
        with:
          # we only upload a single file but we want to set its name to the
          # cqfd flavor, thus we still upload it as an archive
          archive: true
          name: sbom-${{ matrix.cqfd_flavor }}
          path: |
            ${{ env.WORKSPACE }}/build/tmp/deploy/images/**/*.rootfs.spdx.json
          if-no-files-found: error

      # We clean the image directory at the end so we don't pollute
      # future workflows artifacts since in the above step we don't
      # filter the artifacts we upload.
      - name: Clean image deploy directory
        if: always()
        run: |
          # see comment above
          source /etc/bash.bashrc
          cqfd -b ${{ matrix.cqfd_flavor }} run -c --clean-image
